name: Compile data

on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (06:47 IST)
  workflow_dispatch:
    inputs:
      region:
        description: Region config in config/regions/
        default: kochi

permissions:
  contents: read

concurrency:
  group: compile-data
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGION: ${{ inputs.region || 'kochi' }}
      THREEX_CACHE: ${{ github.workspace }}/.threex-cache
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - uses: astral-sh/setup-uv@v6

      # Slow-changing inputs: the cropped tide model, mangrove tiles, climatologies and river
      # medians. OSM and tide gauges are always fetched fresh.
      - name: Restore input cache
        uses: actions/cache@v4
        with:
          path: |
            .threex-cache/tide-models
            .threex-cache/gmw
            .threex-cache/erddap
            .threex-cache/glofas
          key: inputs-${{ env.REGION }}-v1-${{ hashFiles('config/regions/*.json') }}

      - name: Build catalogue
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run threex-compile build --region "$REGION" --out "$GITHUB_WORKSPACE/build"
          uv run threex-compile validate "$GITHUB_WORKSPACE/build"
          cp publish/_headers "$GITHUB_WORKSPACE/build/_headers"

      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-${{ env.REGION }}
          path: build/

      - name: Publish to Cloudflare Pages (threex-data)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy build --project-name threex-data --branch main

      - name: Summary
        run: |
          head -3 build/report/build-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$CF_TOKEN" ]; then
            echo "Not published: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
