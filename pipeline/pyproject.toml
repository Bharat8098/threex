[project]
name = "threex-pipeline"
version = "0.1.0"
description = "Compiles public geodata, tide predictions and habitat layers into ThreeX's static spot catalogue."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "typer>=0.12",
]

[project.scripts]
threex-compile = "compiler.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
